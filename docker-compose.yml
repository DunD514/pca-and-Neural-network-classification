version: '3.8'

services:
  hull-inspection-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: underwater-hull-inspection
    restart: unless-stopped
    ports:
      - "8501:8501"
      - "8502:8502"
    volumes:
      - ./outputs/inspection_logs:/app/outputs/inspection_logs
      - ./outputs/reports:/app/outputs/reports
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

