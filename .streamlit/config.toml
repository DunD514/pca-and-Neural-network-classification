[theme]
base = "dark"
primaryColor = "#00f0ff"
backgroundColor = "#060b14"
secondaryBackgroundColor = "#0d1726"
textColor = "#e2eaf4"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 100
fileWatcherType = "none"

[browser]
gatherUsageStats = false
